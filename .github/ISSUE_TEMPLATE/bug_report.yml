name: Bug report
description: Something in apilive isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real API key here.** If you do by accident, revoke it in the provider's dashboard immediately. Deleting the issue is not enough.
        Security vulnerabilities must be reported privately. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: apilive version
      description: Output of `apilive --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node.js version
      placeholder: "Windows 11, Node 22.14.0"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider (if relevant)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: "`apilive check --json` output or the message from the details panel. Keys are masked. Double-check anyway."
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This report contains no real API keys or secrets.
          required: true
